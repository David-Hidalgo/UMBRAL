services:
  web:
    container_name: web
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    env_file:
      - ./apps/web/.env
    restart: always
    ports:
      - 3000:3000
    networks:
      - app_network
  apigateway:
    container_name: apigateway
    build:
      context: .
      dockerfile: ./apps/server/api/Dockerfile
    restart: always
    depends_on:
      - userservice
      - rabbitmq
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS in .env}
      Keycloak__BaseUrl: http://keycloak:8080
      Keycloak__Realm: umbral
      Keycloak__Audience: account
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN:-http://localhost:3000}
      UserService__BaseUrl: http://userservice:5020
    ports:
      - 5018:5018
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5018/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app_network
  userservice:
    container_name: userservice
    build:
      context: .
      dockerfile: ./apps/server/userService/Dockerfile
    restart: always
    depends_on:
      - keycloak
    environment:
      ASPNETCORE_URLS: http://+:5020
      Keycloak__BaseUrl: http://keycloak:8080
      Keycloak__Realm: umbral
      Keycloak__Audience: account
      Keycloak__AdminClientId: ${KEYCLOAK_ADMIN_CLIENT_ID:-user-service-admin}
      Keycloak__AdminClientSecret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?set KEYCLOAK_ADMIN_CLIENT_SECRET in .env}
    ports:
      - 5020:5020
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5020/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app_network
  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:3-management
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS in .env}
    networks:
      - app_network

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    command: start-dev
    environment:
      KC_HEALTH_ENABLED: true
      KC_HOSTNAME_URL: http://localhost:8080
      KC_HOSTNAME_ADMIN_URL: http://localhost:8080
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
    ports:
      - 8080:8080
    restart: always
    networks:
      - app_network
    volumes:
      - keycloak-data:/opt/keycloak/data
  # native:
  #   container_name: native
  #   build:
  #     context: .
  #     dockerfile: ./apps/native/Dockerfile
  #   env_file:
  #   - ./apps/native/.env
  #   restart: always
  #   ports:
  #     - 8081:8081
  #     - 19000:19000
  #     - 19001:19001
  #     - 19002:19002
  #   networks:
  #     - app_network

volumes:
  keycloak-data: 
# Define a network, which allows containers to communicate
# with each other, by using their container name as a hostname
networks:
  app_network:
