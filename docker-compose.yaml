services:
  web:
    container_name: umbral-web
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    env_file:
      - ./apps/web/.env
    restart: always
    ports:
      - 3000:3000
    networks:
      - app_network

  apigateway:
    container_name: umbral-apigateway
    build:
      context: .
      dockerfile: ./apps/server/api/Dockerfile
    restart: always
    depends_on:
      - userservice
      - rabbitmq
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS in .env}
      # Keycloak__BaseUrl must match the public issuer URL minted in client tokens (localhost:8080).
      # Keycloak__InternalBaseUrl is the container/podman internal hostname (keycloak:8080) for JWT validation backchannel queries.
      Keycloak__BaseUrl: http://localhost:8080
      Keycloak__InternalBaseUrl: http://keycloak:8080
      Keycloak__Realm: umbral
      Keycloak__Audience: account
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN:-http://localhost:3000}
      UserService__BaseUrl: http://userservice:5020
    ports:
      - 5018:5018
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:5018/health > /dev/null || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app_network

  userservice:
    container_name: umbral-userservice
    build:
      context: .
      dockerfile: ./apps/server/userService/Dockerfile
    restart: always
    depends_on:
      - keycloak
      - postgres
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5020
      # Keycloak__BaseUrl must match the public issuer URL minted in client tokens (localhost:8080).
      # Keycloak__InternalBaseUrl is the container/podman internal hostname (keycloak:8080) for JWT validation backchannel queries.
      Keycloak__BaseUrl: http://localhost:8080
      Keycloak__InternalBaseUrl: http://keycloak:8080
      Keycloak__Realm: umbral
      Keycloak__Audience: account
      Keycloak__AdminClientId: ${KEYCLOAK_ADMIN_CLIENT_ID:-user-service-admin}
      Keycloak__AdminClientSecret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?set KEYCLOAK_ADMIN_CLIENT_SECRET in .env}
    ports:
      - 5020:5020
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:5020/health > /dev/null || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app_network

  rabbitmq:
    container_name: umbral-rabbitmq
    image: rabbitmq:3-management
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS in .env}
    networks:
      - app_network

  keycloak:
    container_name: umbral-keycloak
    image: quay.io/keycloak/keycloak:latest
    command: start-dev
    environment:
      KC_HEALTH_ENABLED: true
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_ADMIN: http://localhost:8080
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?set KC_BOOTSTRAP_ADMIN_PASSWORD in .env}
    ports:
      - 8080:8080
    restart: always
    networks:
      - app_network
    volumes:
      - keycloak-data:/opt/keycloak/data

  postgres:
    image: postgres:18
    container_name: umbral-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-umbral_db}
      POSTGRES_USER: ${POSTGRES_USER:-umbral_db_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_MULTIPLE_DATABASES: userservice_db
    ports:
      - 5432:5432
    networks:
      - app_network
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro

  # native:
  #   container_name: umbral-native
  #   build:
  #     context: .
  #     dockerfile: ./apps/native/Dockerfile
  #   env_file:
  #   - ./apps/native/.env
  #   restart: always
  #   ports:
  #     - 8081:8081
  #     - 19000:19000
  #     - 19001:19001
  #     - 19002:19002
  #   networks:
  #     - app_network

volumes:
  keycloak-data:
  postgres-data:

# Define a network, which allows containers to communicate
# with each other, by using their container name as a hostname
networks:
  app_network:
