services:
  web:
    container_name: umbral-web
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    env_file:
      - ./apps/web/.env
    restart: always
    ports:
      - 3000:3000
    networks:
      - app_network

  apigateway:
    container_name: umbral-apigateway
    build:
      context: .
      dockerfile: ./apps/server/api/Dockerfile
    restart: always
    depends_on:
      userservice:
        condition: service_healthy
      missionservice:
        condition: service_healthy
      livesessionservice:
        condition: service_healthy
      scoringservice:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Keycloak__BaseUrl must match the public issuer URL minted in client tokens (localhost:8080).
      # Keycloak__InternalBaseUrl is the container/podman internal hostname (keycloak:8080) for JWT validation backchannel queries.
      Keycloak__BaseUrl: ${SERVICE_URL_KEYCLOAK:-http://localhost:8080}
      Keycloak__InternalBaseUrl: http://keycloak:8080
      Keycloak__Realm: umbral
      Keycloak__Audience: account
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN_0:-http://localhost:3000}
      Cors__AllowedOrigins__1: ${CORS_ALLOWED_ORIGIN_1:-http://localhost:8081}
      ReverseProxy__Clusters__usercluster__Destinations__destination1__Address: http://userservice:5020
      ReverseProxy__Clusters__missioncluster__Destinations__destination1__Address: http://missionservice:5022
      ReverseProxy__Clusters__livesessioncluster__Destinations__destination1__Address: http://livesessionservice:5026
      ReverseProxy__Clusters__scoringcluster__Destinations__destination1__Address: http://scoringservice:5030
    ports:
      - 5018:5018
    healthcheck:
      # La imagen aspnet:10.0 no incluye wget ni curl. Se consulta /health con bash
      # y /dev/tcp, que sí vienen en la imagen (mismo patrón que el healthcheck de keycloak).
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/5018; printf 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; cat <&3 | grep -q Healthy",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app_network

  userservice:
    container_name: umbral-userservice
    build:
      context: .
      dockerfile: ./apps/server/userService/Dockerfile
    restart: always
    depends_on:
      keycloak:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5020
      # Keycloak__BaseUrl must match the public issuer URL minted in client tokens (localhost:8080).
      # Keycloak__InternalBaseUrl is the container/podman internal hostname (keycloak:8080) for JWT validation backchannel queries.
      Keycloak__BaseUrl: ${SERVICE_URL_KEYCLOAK:-http://localhost:8080}
      Keycloak__InternalBaseUrl: http://keycloak:8080
      Keycloak__Realm: umbral
      Keycloak__Audience: account
      Keycloak__AdminClientId: ${KEYCLOAK_ADMIN_CLIENT_ID:-user-service-admin}
      Keycloak__AdminClientSecret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?set KEYCLOAK_ADMIN_CLIENT_SECRET in .env}
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__Username: ${SERVICE_USER_RABBITMQ:-${RABBITMQ_DEFAULT_USER:-guest}}
      RabbitMq__Password: ${SERVICE_PASSWORD_RABBITMQ:-${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS in .env}}
      RabbitMq__ExchangeName: umbral.users
    ports:
      - 5020:5020
    healthcheck:
      # La imagen aspnet:10.0 no incluye wget ni curl. Se consulta /health con bash
      # y /dev/tcp, que sí vienen en la imagen (mismo patrón que el healthcheck de keycloak).
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/5020; printf 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; cat <&3 | grep -q Healthy",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app_network

  missionservice:
    container_name: umbral-missionservice
    build:
      context: .
      dockerfile: ./apps/server/missionService/Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      # SessionEventsConsumer sólo intenta conectarse a RabbitMQ una vez al arrancar:
      # si el broker no está listo, el consumidor muere y los eventos de sesión
      # nunca se procesan. La solución de fondo son reintentos en el consumidor.
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5022
      Keycloak__BaseUrl: ${SERVICE_URL_KEYCLOAK:-http://localhost:8080}
      Keycloak__InternalBaseUrl: http://keycloak:8080
      Keycloak__Realm: umbral
      Keycloak__Audience: account
      ConnectionStrings__DefaultConnection: Host=postgres;Database=missionservice_db;Username=${SERVICE_USER_POSTGRES:-${POSTGRES_USER:-umbral_db_user}};Password=${SERVICE_PASSWORD_POSTGRES:-${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}}
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__Username: ${SERVICE_USER_RABBITMQ:-${RABBITMQ_DEFAULT_USER:-guest}}
      RabbitMq__Password: ${SERVICE_PASSWORD_RABBITMQ:-${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS in .env}}
      # Debe coincidir con el exchange al que publica liveSessionService.
      RabbitMq__ExchangeName: umbral.livesessions
    ports:
      - 5022:5022
    healthcheck:
      # La imagen aspnet:10.0 no incluye wget ni curl. Se consulta /health con bash
      # y /dev/tcp, que sí vienen en la imagen (mismo patrón que el healthcheck de keycloak).
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/5022; printf 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; cat <&3 | grep -q Healthy",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app_network

  livesessionservice:
    container_name: umbral-livesessionservice
    build:
      context: .
      dockerfile: ./apps/server/liveSessionService/Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5026
      Keycloak__BaseUrl: ${SERVICE_URL_KEYCLOAK:-http://localhost:8080}
      Keycloak__InternalBaseUrl: http://keycloak:8080
      Keycloak__Realm: umbral
      Keycloak__Audience: account
      ConnectionStrings__DefaultConnection: Host=postgres;Database=livesessionservice_db;Username=${SERVICE_USER_POSTGRES:-${POSTGRES_USER:-umbral_db_user}};Password=${SERVICE_PASSWORD_POSTGRES:-${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}}
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__Username: ${SERVICE_USER_RABBITMQ:-${RABBITMQ_DEFAULT_USER:-guest}}
      RabbitMq__Password: ${SERVICE_PASSWORD_RABBITMQ:-${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS in .env}}
      RabbitMq__ExchangeName: umbral.livesessions
      MissionService__BaseUrl: http://missionservice:5022
    ports:
      - 5026:5026
    healthcheck:
      # La imagen aspnet:10.0 no incluye wget ni curl. Se consulta /health con bash
      # y /dev/tcp, que sí vienen en la imagen (mismo patrón que el healthcheck de keycloak).
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/5026; printf 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; cat <&3 | grep -q Healthy",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app_network

  scoringservice:
    container_name: umbral-scoringservice
    build:
      context: .
      dockerfile: ./apps/server/scoringService/Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5030
      Keycloak__BaseUrl: ${SERVICE_URL_KEYCLOAK:-http://localhost:8080}
      Keycloak__InternalBaseUrl: http://keycloak:8080
      Keycloak__Realm: umbral
      Keycloak__Audience: account
      # Identidad de servicio del scoring (client credentials) para leer misiones sin el token del jugador.
      Keycloak__ServiceClientId: ${SCORING_SERVICE_CLIENT_ID:-scoring-service}
      Keycloak__ServiceClientSecret: ${SCORING_SERVICE_CLIENT_SECRET:-scoring-dev-secret}
      ConnectionStrings__DefaultConnection: Host=postgres;Database=scoringservice_db;Username=${SERVICE_USER_POSTGRES:-${POSTGRES_USER:-umbral_db_user}};Password=${SERVICE_PASSWORD_POSTGRES:-${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}}
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__Username: ${SERVICE_USER_RABBITMQ:-${RABBITMQ_DEFAULT_USER:-guest}}
      RabbitMq__Password: ${SERVICE_PASSWORD_RABBITMQ:-${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS in .env}}
      # Consume del exchange de sesiones y publica en el suyo propio.
      RabbitMq__ExchangeName: umbral.livesessions
      RabbitMq__ScoringExchangeName: umbral.scoring
      MissionService__BaseUrl: http://missionservice:5022
    ports:
      - 5030:5030
    healthcheck:
      # La imagen aspnet:10.0 no incluye wget ni curl. Se consulta /health con bash
      # y /dev/tcp, que sí vienen en la imagen (mismo patrón que el healthcheck de keycloak).
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/5030; printf 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; cat <&3 | grep -q Healthy",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app_network

  rabbitmq:
    container_name: umbral-rabbitmq
    image: rabbitmq:3-management
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: ${SERVICE_USER_RABBITMQ:-${RABBITMQ_DEFAULT_USER:-guest}}
      RABBITMQ_DEFAULT_PASS: ${SERVICE_PASSWORD_RABBITMQ:-${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS in .env}}
    networks:
      - app_network

  keycloak:
    container_name: umbral-keycloak
    image: quay.io/keycloak/keycloak:26.6
    command: start-dev
    environment:
      KC_HEALTH_ENABLED: true
      KC_HOSTNAME: ${SERVICE_URL_KEYCLOAK:-localhost}
      KC_HTTP_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${SERVICE_USER_ADMIN:-${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${SERVICE_PASSWORD_ADMIN:-${KC_BOOTSTRAP_ADMIN_PASSWORD:?set KC_BOOTSTRAP_ADMIN_PASSWORD in .env}}
      KC_PROXY_HEADERS: xforwarded
      TZ: ${TIMEZONE:-UTC}
    ports:
      - 8080:8080
    restart: always
    networks:
      - app_network
    volumes:
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost:9000\\r\\nConnection: close\\r\\n\\r\\n' >&3;cat <&3 | grep -q '\"status\": \"UP\"' && exit 0 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:18
    container_name: umbral-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-umbral_db}
      POSTGRES_USER: ${SERVICE_USER_POSTGRES:-${POSTGRES_USER:-umbral_db_user}}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES:-${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}}
      POSTGRES_MULTIPLE_DATABASES: userservice_db,missionservice_db,livesessionservice_db,scoringservice_db
    ports:
      - 5432:5432
    networks:
      - app_network
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-umbral_db_user} -d $${POSTGRES_DB:-umbral_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  keycloak-data:
  postgres-data:

# Define a network, which allows containers to communicate
# with each other, by using their container name as a hostname
networks:
  app_network:
