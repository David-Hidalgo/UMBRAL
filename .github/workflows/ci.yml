name: CI Pipeline

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

permissions:
  contents: read
  pull-requests: write

jobs:
  frontend-monorepo-check:
    name: Frontend & Monorepo Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linter & formatter check (Ultracite)
        run: bun run check

  backend-check:
    name: Backend CI (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        working-directory: apps/server
        run: dotnet restore ./server.slnx

      - name: Check Formatting & Code Style (Dotnet Format)
        working-directory: apps/server
        run: |
          dotnet format whitespace ./server.slnx --verify-no-changes
          dotnet format style ./server.slnx --verify-no-changes

      - name: Compile Backend
        working-directory: apps/server
        run: dotnet build ./server.slnx --configuration Release --no-restore

      - name: Run Backend Tests
        working-directory: apps/server
        run: dotnet test ./server.slnx --configuration Release --no-build --settings ./coverlet.runsettings --collect:"XPlat Code Coverage"

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate Merged Coverage Report
        working-directory: apps/server
        run: reportgenerator -reports:"*.Tests/TestResults/*/coverage.cobertura.xml" -targetdir:"coveragereport" -reporttypes:"Cobertura;HtmlInline_AzurePipelines;TextSummary"

      - name: Verify Code Coverage Threshold (90%)
        id: coverage
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: apps/server/coveragereport/Cobertura.xml
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '90 95'

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: always() && github.event_name == 'pull_request' && (steps.coverage.outcome == 'success' || steps.coverage.outcome == 'failure')
        with:
          recreate: true
          path: code-coverage-results.md
