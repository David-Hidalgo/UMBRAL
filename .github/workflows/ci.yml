name: CI Pipeline

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

permissions:
  contents: read
  pull-requests: write

jobs:
  frontend-monorepo-check:
    name: Frontend & Monorepo Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linter & formatter check (Ultracite)
        run: bun run check

  backend-format-check:
    name: Backend Format & Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        working-directory: apps/server
        run: dotnet restore ./server.slnx

      - name: Check Formatting & Code Style
        working-directory: apps/server
        run: |
          dotnet format whitespace ./server.slnx --verify-no-changes
          dotnet format style ./server.slnx --verify-no-changes

  backend-unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        working-directory: apps/server
        run: dotnet restore ./server.slnx

      - name: Compile Backend
        working-directory: apps/server
        run: dotnet build ./server.slnx --configuration Release --no-restore

      - name: Run Unit Tests
        working-directory: apps/server
        run: dotnet test ./server.slnx --configuration Release --no-build --settings ./coverlet.runsettings --collect:"XPlat Code Coverage" --filter "Category!=Integration"

      - name: Upload Unit Test Coverage
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: apps/server/**/*.Tests/TestResults/*/coverage.cobertura.xml

  backend-integration-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: umbral_db
          POSTGRES_USER: umbral_db_user
          POSTGRES_PASSWORD: umbral_db_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U umbral_db_user -d umbral_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics check_port_connectivity"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        working-directory: apps/server
        run: dotnet restore ./server.slnx

      - name: Compile Backend
        working-directory: apps/server
        run: dotnet build ./server.slnx --configuration Release --no-restore

      - name: Run Integration Tests
        working-directory: apps/server
        env:
          RUN_INTEGRATION_TESTS: true
        run: dotnet test ./server.slnx --configuration Release --no-build --settings ./coverlet.runsettings --collect:"XPlat Code Coverage" --filter "Category=Integration"

      - name: Upload Integration Test Coverage
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-coverage
          path: apps/server/**/*.Tests/TestResults/*/coverage.cobertura.xml

  backend-coverage-report:
    name: Backend Coverage & Threshold Report
    runs-on: ubuntu-latest
    needs: [backend-unit-tests, backend-integration-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download Unit Test Coverage
        uses: actions/download-artifact@v4
        with:
          name: unit-test-coverage
          path: coverage/unit

      - name: Download Integration Test Coverage
        uses: actions/download-artifact@v4
        with:
          name: integration-test-coverage
          path: coverage/integration

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate Merged Coverage Report
        run: reportgenerator -reports:"coverage/**/*.xml" -targetdir:"apps/server/coveragereport" -reporttypes:"Cobertura;HtmlInline_AzurePipelines;TextSummary"

      - name: Verify Code Coverage Threshold (90%)
        id: coverage
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: apps/server/coveragereport/Cobertura.xml
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '90 95'

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: always() && github.event_name == 'pull_request' && (steps.coverage.outcome == 'success' || steps.coverage.outcome == 'failure')
        with:
          recreate: true
          path: code-coverage-results.md
